[package]
name = "research-agent"
version = "2.1.5"
description = "Proof Over Hallucination — Open-source offline research agent"
authors = ["Pavan Kumar"]
edition = "2021"

[lib]
name = "research_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
scraper = "0.19"
walkdir = "2.5"
url = "2.5"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
